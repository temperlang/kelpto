# Kelpto's Temper tests, with Temper's new compiler (tempest, written in
# Rust), in two tiers. Every push and pull request runs the quick tier,
# the four libraries' own tests (`-ign tests/quick.temperignore` leaves
# out the test libraries under tests/), on the fastest backends. Nightly,
# and when run by hand, the full suite runs on all seven, the vendored
# conformance suites and the pathological inputs included.
name: test

on:
  push:
  pull_request:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # The same pin as site.yml's; change both together. Until the new
  # compiler's switch lands, its nightly build (from temperlang/tempest's
  # main) lags the fixes Kelpto relies on, so CI builds it from a pinned
  # commit of its transition branch, rfc-657-transition. Once the switch
  # lands, download Temper's nightly from temperlang/temper's releases
  # instead, and drop the `temper` job's build.
  TEMPEST_COMMIT: 5f3cf49801fcd5f125ea2175cc5cb993b630419b
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  # The compiler, built once per pin (the cache is shared with
  # site.yml's), as an artifact for the other jobs.
  temper:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Actions are pinned by commit, with the release in a comment.
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/temper-bin
          key: tempest-${{ runner.os }}-${{ env.TEMPEST_COMMIT }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: temperlang/tempest
          ref: ${{ env.TEMPEST_COMMIT }}
          path: tempest
          persist-credentials: false
          # The whole history and its tags, from which the compiler names
          # its version, as its releases are built.
          fetch-depth: 0
      # Tempest's minimum Rust, which its own CI builds with.
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@cfcaf53ba4c621917ec7f78a66bff7a8848ddad4 # 1.85.0 branch, 2026-10-16
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Build the compiler
        working-directory: tempest
        run: |
          cargo build --locked --release -p tempest
          mkdir -p "$RUNNER_TEMP/temper-bin"
          cp target/release/temper "$RUNNER_TEMP/temper-bin/"
      # Checkouts must be inside the workspace, but Temper builds every
      # Temper file under it, so the compiler's sources must go.
      - if: steps.cache.outputs.cache-hit != 'true'
        run: rm -rf tempest
      - run: '"$RUNNER_TEMP/temper-bin/temper" --version'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: temper
          path: ${{ runner.temp }}/temper-bin/temper
          retention-days: 3

  test:
    name: test (${{ matrix.backend }})
    needs: temper
    # Pinned for Ubuntu's lua5.4, which is 5.4.6 on noble.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      # Report every backend, even if one fails.
      fail-fast: false
      matrix:
        backend: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'pull_request') && '["js", "lua", "py"]' || '["cpp", "csharp", "java", "js", "lua", "py", "rust"]') }}
    env:
      # The quick tier's ignore file, or nothing for the full suite.
      TIER: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && '-ign tests/quick.temperignore' || '' }}
      # C++ compiles through ccache, whose cache actions/cache keeps.
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: temper
          path: ${{ runner.temp }}/temper-bin
      - name: Get Temper
        run: |
          chmod +x "$RUNNER_TEMP/temper-bin/temper"
          echo "$RUNNER_TEMP/temper-bin" >> "$GITHUB_PATH"

      # Toolchains per backend, as Temper's own CI sets them up. Runners
      # already have g++, CMake, cargo, and Maven.
      - if: matrix.backend == 'py'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # Mocha runs the JS tests.
      - if: matrix.backend == 'js'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - if: matrix.backend == 'js'
        run: npm install --global mocha@11.8.0
      # JUnit, which the Java tests read from Maven's cache.
      - if: matrix.backend == 'java'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - if: matrix.backend == 'java'
        run: |
          mvn -q dependency:get -Dartifact=org.junit.jupiter:junit-jupiter-engine:5.9.2
          mvn -q dependency:get -Dartifact=org.junit.platform:junit-platform-launcher:1.9.2
      # Generated C# targets .NET 6, as Kotlin's projects do.
      - if: matrix.backend == 'csharp'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "6.0.x"
      # Lua 5.4.6, from Ubuntu's archive, as `lua`.
      - if: matrix.backend == 'lua'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lua5.4
          sudo update-alternatives --set lua-interpreter /usr/bin/lua5.4
          lua -v
      # libcurl's headers, for std's net in generated C++, and ccache.
      # The cache restores the latest one saved and saves a new one each
      # run, so it follows the code.
      - if: matrix.backend == 'cpp'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libcurl4-openssl-dev ccache
      - if: matrix.backend == 'cpp'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ env.TEMPEST_COMMIT }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.TEMPEST_COMMIT }}-
            ccache-${{ runner.os }}-
      - if: matrix.backend == 'cpp'
        run: ccache --zero-stats

      # Rust's tests build offline, so the crates generated code needs go
      # in cargo's cache first.
      - if: matrix.backend == 'rust'
        run: |
          temper build -b rust $TIER
          for manifest in temper.out/rust/*/Cargo.toml; do
            cargo fetch --manifest-path "$manifest"
          done

      - name: Test
        run: temper test -b ${{ matrix.backend }} $TIER

      - if: always() && matrix.backend == 'cpp'
        run: ccache --show-stats
